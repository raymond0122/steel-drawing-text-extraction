[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-drawing-text-extraction"
version = "0.1.0"
description = "Tiled OCR, cross-tile dedup and LLM label filtering for structural steel drawings, plus a JWT auth API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.1",
    "requests>=2.31",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyJWT>=2.8",
    "passlib>=1.7.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",      # FastAPI's TestClient
    "ruff==0.17.4",     # pinned so local runs and CI agree on the rules
    "mypy==2.4.1",      # same
    "types-requests",
    "types-passlib",
    "types-openpyxl",
]

[project.scripts]
steel-demo = "steel_text.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"steel_text.web" = ["index.html", "app.js", "style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade (modern typing syntax)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Safe as argument defaults: FastAPI's dependency markers, and a frozen dataclass.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "steel_text.dedup.DedupConfig"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests use small untyped fakes; the calls into the package are still checked.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
